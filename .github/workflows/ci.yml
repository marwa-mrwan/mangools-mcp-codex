name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Mangools MCP
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify tool registry
        run: npm run list-tools

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Reject common committed secret formats
        shell: bash
        run: |
          if git grep -I -n -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|1//[0-9A-Za-z_-]{20,}'; then
            echo "Potential secret detected in tracked files."
            exit 1
          fi
